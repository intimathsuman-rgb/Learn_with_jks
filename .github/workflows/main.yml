name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project archives
        shell: bash
        run: |
          set -euo pipefail

          OUTER_ZIP=$(find . -type f -name 'LearnWithJKS_GitHub_Upload.zip' -print -quit)
          test -n "$OUTER_ZIP"

          mkdir -p outer
          unzip -q "$OUTER_ZIP" -d outer

          INNER_ZIP=$(find outer -type f -name 'LearnWithJKS_Android_Project.zip' -print -quit)

          if [ -z "$INNER_ZIP" ]; then
            INNER_ZIP=$(find outer -type f -iname '*Android*Project*.zip' -print -quit || true)
          fi

          test -n "$INNER_ZIP"

          mkdir -p project
          unzip -q "$INNER_ZIP" -d project

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW=$(find project -type f -name gradlew -print -quit)
          test -n "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix FirebaseException import
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$PROJECT_DIR/app/src/main/java/com/learnwithjks/app/MainActivity.java"

          sed -i '/^package com.learnwithjks.app;/a import com.google.firebase.FirebaseException;' "$MAIN_ACTIVITY"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew clean :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithJKS-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
