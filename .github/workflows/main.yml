name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project archives
        shell: bash
        run: |
          set -euo pipefail

          OUTER_ZIP=$(find . -type f -name 'LearnWithJKS_GitHub_Upload.zip' -print -quit)
          test -n "$OUTER_ZIP"

          mkdir -p outer
          unzip -q "$OUTER_ZIP" -d outer

          INNER_ZIP=$(find outer -type f -name 'LearnWithJKS_Android_Project.zip' -print -quit)

          if [ -z "$INNER_ZIP" ]; then
            INNER_ZIP=$(find outer -type f -iname '*Android*Project*.zip' -print -quit || true)
          fi

          test -n "$INNER_ZIP"

          mkdir -p project
          unzip -q "$INNER_ZIP" -d project

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit || true)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            GRADLEW=$(find project -type f -name 'gradlew' -print -quit || true)

            if [ -z "$GRADLEW" ]; then
              echo "Android project files could not be located."
              echo "Files found:"
              find project -maxdepth 6 -type f | head -200
              exit 1
            fi

            PROJECT_DIR=$(dirname "$GRADLEW")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Fix FirebaseException import
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY=$(find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name 'MainActivity.java' \
            -print -quit || true)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          if ! grep -q 'import com.google.firebase.FirebaseException;' "$MAIN_ACTIVITY"; then
            sed -i '/^package /a import com.google.firebase.FirebaseException;' "$MAIN_ACTIVITY"
          fi

          echo "FirebaseException import checked."

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean :app:assembleDebug --no-daemon --stacktrace
          else
            gradle clean :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithJKS-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
