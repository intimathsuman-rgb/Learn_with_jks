name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q "LearnWithJKS_FIREBASE_OTP.zip" -d android-project

      - name: Find Gradle project
        id: findroot
        shell: bash
        run: |
          ROOT=$(find "$GITHUB_WORKSPACE/android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          echo "Gradle project found at: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Fix Firebase Java errors
        run: |
          FILE=$(find "$GITHUB_WORKSPACE/android-project" -type f -name "MainActivity.java" -print -quit)

          if [ -z "$FILE" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          sed -i 's/setTimeout(60, TimeUnit.SECONDS)/setTimeout(60L, TimeUnit.SECONDS)/g' "$FILE"

          sed -i '/import com.google.firebase.auth.FirebaseTooManyRequestsException;/d' "$FILE"

          sed -i '/instanceof FirebaseTooManyRequestsException/d' "$FILE"

      - name: Build APK
        working-directory: ${{ steps.findroot.outputs.root }}
        run: gradle clean :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Learn-With-JKS-APK
          path: ${{ steps.findroot.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
