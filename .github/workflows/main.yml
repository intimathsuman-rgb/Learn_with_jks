name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract Android ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname '*500*STUDENTS*COMPLETE*.zip' \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Complete Android ZIP not found."
            find . -maxdepth 1 -type f
            exit 1
          fi

          mkdir -p android_project
          unzip -q "$ZIP_FILE" -d android_project

          PROJECT_DIR=$(find android_project \
            -name settings.gradle -type f \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found after extraction."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle clean :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Learn-With-JKS-APK
          path: android_project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
