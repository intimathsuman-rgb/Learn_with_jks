name: Build Learn With JKS Fixed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Correct Android Source
        shell: bash
        run: |
          set -e

          SOURCE_ZIP="$GITHUB_WORKSPACE/LearnWithJKS_50_FULL_FIXED_SOURCE.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Correct source ZIP not found."
            echo "Required: LearnWithJKS_50_FULL_FIXED_SOURCE.zip"
            echo "Repository files:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/fixed_source"

          unzip -q "$SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/fixed_source"

          PROJECT_DIR="$GITHUB_WORKSPACE/fixed_source"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "ERROR: Firebase configuration not found."
            exit 1
          fi

          echo "Correct source verified."
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            -p "$GITHUB_WORKSPACE/fixed_source" \
            clean :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/fixed_source/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithJKS-Fixed-APK
          path: fixed_source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
