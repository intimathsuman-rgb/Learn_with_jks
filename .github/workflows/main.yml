name: Build Learn With JKS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ONLY the new project
        run: |
          rm -rf project
          unzip -q LearnWithJKS_DIRECT_BUILD.zip -d project

          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/AndroidManifest.xml

          echo "NEW PROJECT VERIFIED"
          grep -R "App successfully started" project/app/src/main || true

      - name: Build APK
        run: |
          cd project
          gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithJKS-FINAL-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
