name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Extract Learn With JKS project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project

          test -f LearnWithJKS_GITHUB_READY_v21.zip

          unzip -q LearnWithJKS_GITHUB_READY_v21.zip -d project

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          test -f project/app/google-services.json
          test -f project/app/src/main/AndroidManifest.xml
          test -f project/app/src/main/java/com/learnwithjks/app/MainActivity.java

          echo "Project files verified."


      - name: Verify Firebase exception import
        shell: bash
        run: |
          set -euo pipefail

          ! grep -q 'com.google.firebase.auth.FirebaseTooManyRequestsException' \
            project/app/src/main/java/com/learnwithjks/app/MainActivity.java

          grep -q 'com.google.firebase.FirebaseTooManyRequestsException' \
            project/app/src/main/java/com/learnwithjks/app/MainActivity.java

          echo "Correct Firebase exception import verified."


      - name: Fix Firebase timeout type
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/\.setTimeout(60, TimeUnit\.SECONDS)/.setTimeout(60L, TimeUnit.SECONDS)/g' \
            project/app/src/main/java/com/learnwithjks/app/MainActivity.java

          grep -q '.setTimeout(60L, TimeUnit.SECONDS)' \
            project/app/src/main/java/com/learnwithjks/app/MainActivity.java

          echo "Firebase timeout type verified."


      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd project

          gradle clean :app:assembleDebug --stacktrace


      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -f project/app/build/outputs/apk/debug/app-debug.apk

          echo "APK BUILD SUCCESSFUL"


      - name: Get APK SHA fingerprints
        shell: bash
        run: |
          set -euo pipefail

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            -type f | sort -V | tail -n 1)

          test -f "$APKSIGNER"

          echo "======================================"
          echo "LEARN WITH JKS APK FINGERPRINTS"
          echo "======================================"

          "$APKSIGNER" verify --print-certs "$APK"

          echo "======================================"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithJKS-FINAL-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
