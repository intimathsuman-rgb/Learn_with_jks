name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Firebase OTP project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project

          test -f LearnWithJKS_FIREBASE_OTP.zip

          unzip -q LearnWithJKS_FIREBASE_OTP.zip -d project

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          test -f project/app/google-services.json
          test -f project/app/src/main/AndroidManifest.xml

          echo "FIREBASE OTP PROJECT VERIFIED"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd project

          gradle clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -f project/app/build/outputs/apk/debug/app-debug.apk

          echo "APK BUILD SUCCESSFUL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithJKS-Firebase-OTP-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
