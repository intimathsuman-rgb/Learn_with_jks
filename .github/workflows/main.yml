name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          OUTER_ZIP=$(find . -type f \
            -name 'LearnWithJKS_GitHub_Upload.zip' \
            -print -quit)

          test -n "$OUTER_ZIP"

          mkdir -p outer
          unzip -q "$OUTER_ZIP" -d outer

          INNER_ZIP=$(find outer -type f \
            -name 'LearnWithJKS_Android_Project.zip' \
            -print -quit)

          test -n "$INNER_ZIP"

          mkdir -p project
          unzip -q "$INNER_ZIP" -d project

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find project -type f \
            -name 'settings.gradle' \
            -print -quit)

          test -n "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithJKS-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
