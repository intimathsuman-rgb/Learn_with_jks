name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository Files
        run: |
          echo "Repository files:"
          ls -la
          echo "Searching for Android project..."
          find . -maxdepth 5 -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) -print

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""
          while IFS= read -r file; do
            dir="${file%/*}"
            if [ -f "$dir/gradlew" ] || \
               [ -f "$dir/build.gradle" ] || \
               [ -f "$dir/build.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find . -maxdepth 5 -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "The repository must contain an Android project."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Learn-With-JKS-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
