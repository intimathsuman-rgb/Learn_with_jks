name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project archives
        shell: bash
        run: |
          set -euo pipefail

          OUTER_ZIP=$(find . -type f -name 'LearnWithJKS_GitHub_Upload.zip' -print -quit)
          test -n "$OUTER_ZIP"

          mkdir -p outer
          unzip -q "$OUTER_ZIP" -d outer

          INNER_ZIP=$(find outer -type f -name 'LearnWithJKS_Android_Project.zip' -print -quit)
          test -n "$INNER_ZIP"

          mkdir -p project
          unzip -q "$INNER_ZIP" -d project

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=$(find project -type f -name 'settings.gradle' -print -quit | xargs dirname)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithJKS-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
