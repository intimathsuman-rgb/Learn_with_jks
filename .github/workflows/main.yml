name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # सेटअप जावा को v5 पर अपडेट किया गया है और एरर को रोकने के लिए कैशिंग को एक्सट्रैक्ट स्टेप के बाद रखा गया है
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android Project ZIP
        run: |
          mkdir -p android-project
          if [ -f "LearnWithJKS_FIREBASE_OTP.zip" ]; then
            unzip -q "LearnWithJKS_FIREBASE_OTP.zip" -d android-project
          else
            echo "Error: LearnWithJKS_FIREBASE_OTP.zip not found in root repository!"
            exit 1
          fi

      # प्रोजेक्ट एक्सट्रैक्ट होने के बाद अब यह बिना किसी एरर के आपकी फाइलों को खोज लेगा
      - name: Find Gradle Root Directory
        id: findroot
        shell: bash
        run: |
          ROOT_FILE=$(find "$GITHUB_WORKSPACE/android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$ROOT_FILE" ]; then
            echo "Gradle project structure not found!"
            exit 1
          fi

          ROOT=$(dirname "$ROOT_FILE")
          echo "Gradle project found at: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Fix Firebase Code & Permissions
        run: |
          FILE=$(find "$GITHUB_WORKSPACE/android-project" -type f -name "MainActivity.java" -print -quit)

          if [ -z "$FILE" ]; then
            echo "Warning: MainActivity.java not found, skipping patch."
          else
            sed -i '/FirebaseTooManyRequestsException/d' "$FILE"
            sed -i 's/setTimeout(60, TimeUnit.SECONDS)/setTimeout(60L, TimeUnit.SECONDS)/g' "$FILE"
          fi
          
          cd "${{ steps.findroot.outputs.root }}"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.findroot.outputs.root }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean :app:assembleDebug --stacktrace
          fi

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: Learn-With-JKS-APK
          path: |
            ${{ steps.findroot.outputs.root }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
