name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Learn With JKS v21
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project

          test -f LearnWithJKS_GITHUB_READY_v21.zip

          unzip -q LearnWithJKS_GITHUB_READY_v21.zip -d project

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          test -f project/app/google-services.json
          test -f project/app/src/main/AndroidManifest.xml
          test -f project/app/src/main/java/com/learnwithjks/app/MainActivity.java

          echo "Project files verified."

      - name: Fix and verify MainActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="project/app/src/main/java/com/learnwithjks/app/MainActivity.java"

          # Correct Firebase exception import
          sed -i 's/import com\.google\.firebase\.auth\.FirebaseTooManyRequestsException;/import com.google.firebase.FirebaseTooManyRequestsException;/' "$FILE"

          # Correct PhoneAuth timeout type
          sed -i 's/setTimeout(60, *TimeUnit\.SECONDS)/setTimeout(60L, TimeUnit.SECONDS)/g' "$FILE"

          # Make sure old/wrong import is gone
          ! grep -q 'com.google.firebase.auth.FirebaseTooManyRequestsException' "$FILE"

          # Make sure correct import exists
          grep -q 'com.google.firebase.FirebaseTooManyRequestsException' "$FILE"

          # Make sure timeout uses Long
          grep -q 'setTimeout(60L, TimeUnit.SECONDS)' "$FILE"

          echo "MainActivity fixes verified."

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd project

          gradle clean :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -f project/app/build/outputs/apk/debug/app-debug.apk

          echo "================================="
          echo "APK BUILD SUCCESSFUL"
          echo "================================="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithJKS-FINAL-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
