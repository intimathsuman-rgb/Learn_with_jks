name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname 'LearnWithJKS_GitHub*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Build APK
        run: |
          set -e
          PROJECT_DIR=$(find extracted -name gradlew -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "gradlew not found"
            exit 1
          fi

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithJKS-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
