name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          set -e

          ZIP=$(find . -type f -name 'LearnWithJKS_GitHub_Upload.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Find Android project
        run: |
          set -e

          GRADLEW=$(find extracted -type f -name 'gradlew' -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found inside Android project"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithJKS-APK
          path: |
            **/build/outputs/apk/debug/*.apk
