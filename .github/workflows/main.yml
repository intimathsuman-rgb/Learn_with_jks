name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/jks_project"

          python3 - <<'PY'
          import os
          import zipfile

          root = os.getcwd()
          output = os.path.join(
              os.environ["RUNNER_TEMP"], "jks_project"
          )
          os.makedirs(output, exist_ok=True)

          archives = []
          for current, dirs, files in os.walk(root):
              dirs[:] = [
                  d for d in dirs
                  if d != ".git" and d != ".github"
              ]
              for name in files:
                  if name.lower().endswith(".zip"):
                      archives.append(
                          os.path.join(current, name)
                      )

          for archive in archives:
              print("Checking archive:", archive)
              try:
                  with zipfile.ZipFile(archive) as z:
                      z.extractall(output)
              except Exception as e:
                  print("Could not extract:", e)

          print("Extraction completed.")
          PY

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT=""

          for ROOT in "$RUNNER_TEMP/jks_project" "$GITHUB_WORKSPACE"; do
            PROJECT=$(find "$ROOT" \
              -type f -name gradlew \
              -not -path '*/.git/*' \
              -print -quit 2>/dev/null || true)

            if [ -n "$PROJECT" ]; then
              break
            fi
          done

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "The ZIP files must contain an Android project with gradlew."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project found: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.dir }}"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Learn-With-JKS-APK
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
